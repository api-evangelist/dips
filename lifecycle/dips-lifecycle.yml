versioning:
  scheme: none-published
  detail: >-
    The Open DIPS portal exposes one published API version ("DIPS Federation Service", apiVersion
    absent, contract info.version 1.0) and no version selector. There is no /v1 path segment, no
    version header and no documented version-negotiation policy. The FHIR surface is versioned by
    the FHIR release it implements (R4 / 4.0.1) rather than by a DIPS version scheme.
