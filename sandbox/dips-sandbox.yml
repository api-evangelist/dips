tooling:
  test_clocks: false
  fixtures_or_triggers: false
  test_cards: false
  reference_app:
    name: hello-open-dips
    url: https://github.com/DIPSAS/hello-open-dips
    detail: SMART on FHIR React application published by DIPS as the Open DIPS starting point.
  detail: >-
    No time simulation, event triggers or fixture-generation tooling is published. The sandbox is a
    fixed synthetic dataset a developer reads from.
