generated: '2026-09-02'
method: searched
source: https://dips.developer.azure-api.net/data
note: >-
  Open DIPS IS a sandbox — the whole developer programme is a virtual DIPS Arena test environment
  containing only synthetic data. Values below are published by DIPS on its own getting-started and
  data pages and are reproduced as published. The synthetic Norwegian national identity numbers DIPS
  lists beside each test patient are deliberately NOT reproduced here; they are on the linked page.
sandbox:
  name: Open DIPS sandbox
  url: https://dips.developer.azure-api.net/
  data_url: https://dips.developer.azure-api.net/data
  cost: free
  live_equivalent: false
  detail: >-
    There is no test-vs-live key pair. Open DIPS is a separate environment; access to a real DIPS
    Arena client environment is a separate commercial agreement, not a mode switch. That means an
    application validated here still has an unmodelled step before it touches real patient data.
credentials:
  api_key:
    name: Ocp-Apim-Subscription-Key
    obtained_from: the Open DIPS profile page after sign-up at https://dips.developer.azure-api.net/signup
    prefixes: []
    note: Azure API Management subscription key. DIPS publishes no key prefix convention.
  test_user:
    username: opendips
    password: opendips
    role: USERNAME Full funksjonstilgang og VID datatilgang (BT)
    note: >-
      Published verbatim on https://dips.developer.azure-api.net/data as the general test user with
      access to most sandbox functionality. Recommended role is the one shown.
test_data:
  source: Synthetic test patients originating from Norsk Helsenett.
  patients:
