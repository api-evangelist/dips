apis:
- name: DIPS Federation Service
  description: 'DIPS Federation Service (DFS) is the OpenID Connect provider and OAuth
    2.0 authorization server in front of every Open DIPS API. Built on IdentityServer4
    and certified by the OpenID Foundation, it supports authorization code, hybrid
    and implicit OpenID Connect flows plus SAML 2.0 and JWT bearer assertion grants
    and DIPS-specific user-role and patient-access-check grants.'
  humanURL: https://dips.developer.azure-api.net/api-details#api=dips_federation_service_prod
  baseURL: https://api.dips.no/dips.oauth
  tags:
  - Authentication
  - OpenID Connect
  - OAuth 2.0
  - Identity
  properties:
  - type: OpenAPI
    url: openapi/dips-federation-service-openapi.yml
  - type: Authentication
    url: authentication/dips-authentication.yml
  - type: OAuthScopes
    url: scopes/dips-scopes.yml
  - type: ErrorCatalog
    url: errors/dips-problem-types.yml
  - type: Overlay
    url: overlays/dips-federation-service-overlay.yaml
  - type: DataModel
    url: data-model/dips-data-model.yml
  - type: Documentation
    url: https://dips.developer.azure-api.net/getting-started
- name: DIPS FHIR R4 API
  description: 'The DIPS HL7 FHIR R4 API exposes core clinical and administrative data
    from the DIPS Arena EHR — Patient, Person, RelatedPerson, Practitioner,
    PractitionerRole, Organization, Location, HealthcareService, Encounter,
    Appointment, DocumentReference and vital-sign Observations. It is profiled by the
    public DIPS Core Implementation Guide, which builds on the Norwegian national
    hl7.fhir.no.basis package, and is reachable in the Open DIPS sandbox with a
    portal subscription key and a SMART on FHIR access token.'
  humanURL: https://dipsas.github.io/FHIR-IG/
  baseURL: https://api.dips.no/fhir
  tags:
  - FHIR
  - Healthcare
  - Clinical Data
  - SMART on FHIR
  properties:
