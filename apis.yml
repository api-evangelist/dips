aid: dips
name: DIPS
description: 'DIPS AS is Norway''s largest supplier of electronic health record (EHR)
  systems to hospitals, in operation since 1987 and headquartered in Bodø. Its DIPS
  Arena EHR is built on the openEHR reference model and exposes standardised HL7 FHIR
  R4 and openEHR REST interfaces. Through Open DIPS — a public developer portal and
  synthetic-data sandbox at dips.developer.azure-api.net — DIPS publishes an OpenID
  Connect provider (DIPS Federation Service), a FHIR Patient API and a SMART on FHIR
  launch surface, backed by a public FHIR R4 Implementation Guide and an openEHR
  archetype repository on GitHub.'
url: https://raw.githubusercontent.com/api-evangelist/dips/refs/heads/main/apis.yml
image: https://dips.developer.azure-api.net/content/Dips_symbol.png
x-type: company
x-source: harvest:openehr-coalition
