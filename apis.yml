apis:
- name: DIPS FHIR R4 API
  description: >-
    The DIPS HL7 FHIR R4 API exposes core clinical and administrative data from the DIPS Arena EHR — Patient,
    Person, RelatedPerson, Practitioner, PractitionerRole, Organization, Location, HealthcareService,
    Encounter, Appointment, DocumentReference and vital-sign Observations. It is profiled by the public
    DIPS Core Implementation Guide, which builds on the Norwegian national hl7.fhir.no.basis package,
    and is reachable in the Open DIPS sandbox with a portal subscription key and a SMART on FHIR access
    token.
  humanURL: https://dipsas.github.io/FHIR-IG/
  baseURL: https://api.dips.no/fhir
  tags:
  - FHIR
  - Healthcare
  - Clinical Data
  - SMART on FHIR
